---
- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: false

- name: Restart swayidle service
  ansible.builtin.systemd:
    name: swayidle.service
    scope: user
    state: restarted
  become: false
  when: swaywm_swayidle_enabled | bool
